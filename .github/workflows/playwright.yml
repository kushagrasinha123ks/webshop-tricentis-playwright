name: Playwright

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      suite:
        description: Test suite
        type: choice
        options:
          - smoke
          - regression
          - e2e
        default: smoke

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: '1'
      SUITE: ${{ github.event.inputs.suite || 'smoke' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run "test:$SUITE"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          retention-days: 14
